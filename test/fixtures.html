<!--
  Each case below runs in its own iframe (srcdoc) that loads lib/*.js + content/widgets.js, qa.js, overlay.js, filler.js (the order
  background.js injects them in), so cases never share state.
  Case attributes: data-id, data-item, data-title, data-persona ("IN", "US", "IN:<City>"), data-patch (JSON merged into the persona),
    data-opts (JSON merged into the settings), data-repeat (fresh iframe + persona per run; a check passes only if it passes every run),
    data-check (custom checks, see CHECKS), data-allow, data-count ("0" | ">0" | "<n>"), data-nofill, data-html-attrs, data-body-attrs, data-head,
    data-prefs (JSON settings: the persona goes through FormGhost.withPrefs, as the background does),
    data-focus (selector, also inside shadow roots: focused right before fill(); use with data-opts '{"scope":"field","frameTargeted":true}'),
    data-hasfocus ("true" | "false": document.hasFocus() answers this during fill()),
    data-mimic (widget stand-ins from MIMICS injected after the case HTML: widgets flatpickr rdp iti rpni mask strict model bsdp),
    data-timeout (ms before the case counts as hung; default 1500).
    data-arg (JSON for a custom check), and the library mimics rselect mui ant radix headless aria downshift gforms.
  fill() may return a number or { count, used }, or a promise of either; the harness waits for it, then one more task.
  Field attributes (on inputs / selects / textareas, and on contenteditable editors, whose value is their text):
    data-cat    expected __formGhost.inspect() category; "a|b" = any of, "!a" = anything but a.
    data-reason with data-cat="skip": allowed reasons, "a|b".
    data-val    value after fill(); conditions joined by " && ", alternatives by " || ". Atoms:
                empty | filled | same (unchanged) | checked | unchecked | avoid (select not on Other/N-A...) | nottrivial (no 0000/1234)
                | !ids (not any persona ID number) | =literal | ~regex | $persona.path | $#path (compare letters+digits only)
                | #tel:path (same phone number as that persona phone object or string, digits only) | !atom (negates any other atom)
                valid (non-empty, checkValidity() and minlength / maxlength, which the browser only checks on user edits)
                | past / future (the date is on or before / after today; past also after the DOB) | weekday | @path (same date as that persona date)
                | after:#id (date on or after that field's) | ==#id (same value as that field) | nsel:1-2 (a multiple select with 1-2 real options)
                | ref:field (P.references[i].field, i from the closest data-refblock: "0" / "1", or "" = either, the same one for the whole block).
                Dates are read as ISO, as type=month / week, or by the field's data-fmt ("DD MMM YYYY", "MM/DD/YYYY", "MM/YY"…; tokens YYYY YY MMMM MMM MM M DD D).
                Derived paths: dobDMY dobMDY genderLabel cityState bloodVe ("B +ve") bloodWord ("B Positive") noticeMonth ("1 month") nomineeDobDMY nomineeDobISO
                ppIssue ppExpiry dlIssue dlExpiry (P.idDates, a few key spellings accepted) landlineDigits (std + number) landlineNat (without the trunk 0)
                houseNo (the house number in P.address1).
    data-seen-want  with data-check="undo": the element's data-seen (set by its own oninput/onchange) after undo().
    data-undo-want  with data-check="pickerUndo" / "editorUndo": the value / text after undo().
    data-text   on any element: its text after fill() (a widget the filler must leave alone).
                tpl:<template> (a rule template for this persona; random tokens by shape, unknown ones empty) | inP (equals a value
                somewhere in the persona, letters + digits) | chk:gstin / cpf / cnpj / luhn | bademail | edgenum (outside min..max or not whole)
                | overlong (longer than maxlength) | safe (no script / handler / SQL) | testcard.
  Container attributes: data-group  "one" | "atleast1" | "none" | "avoid" | "is:$path" (checked radio/checkbox inside it); data-refblock (see ref:).
  Widget attributes: data-wval (on a library widget's root: its own chosen label after fill(), same grammar, or "same"; its list must be
    closed), data-aria (on an ARIA toggle: checked | unchecked | same; on a group: one | atleast1 | none | avoid | is:$path; on a grid: rows:one;
    data-state / hidden bubble inputs must agree), data-rec / data-norec (records()), data-file (sample files: a name, ~regex or none),
    data-wkind / data-wpick / data-wtoggle (widgets API).
  Every filled case also checks that readonly / disabled / maxlength / minlength / pattern / min / max / step / type attributes are left alone.
  Macros in case HTML: {{days}} {{months}} {{years}} {{mm}} {{yyyy}} {{us-states}} {{days0}} {{months0}} {{years0}} {{n0-30}};
    dates relative to today: {{date:+N}} (YYYY-MM-DD, N days on) {{dt:+N}} (datetime-local at 09:00) {{month:+N}} (YYYY-MM) {{week:+N}} (YYYY-Www, N weeks on).
  An inline script in case HTML is written <fg-script>…</fg-script> (a literal end-script tag would close the case block).
-->

<script>
(() => {
  'use strict';
  const KEEP = /[?&]keep\b/.test(location.search);
  const ONLY = decodeURIComponent((location.search.match(/[?&]only=([^&]*)/) || [])[1] || '');
  /* the background's lib order, then the content scripts in the order background.js injects them */
  const MODULES = ['../content/widgets.js', '../content/qa.js', '../content/overlay.js', '../content/filler.js'];
  const SCRIPTS = ['../lib/locales.js', '../lib/data-in.js', '../lib/profile.js', '../lib/persona.js'].concat(MODULES);
  const DEF_OPTS = { country: 'auto', phoneMode: 'smart', overwrite: false, highlight: false, checkboxes: true, requiredOnly: false, blocked: [], emailDomain: '', emailInbox: '', testPhones: false,
    edgeMode: false, sampleFiles: false, testCards: false, overrides: [], rules: [] };
  const CONTROLS = 'input,select,textarea';

  const FRAME_CSS = 'body{font:14px sans-serif;margin:8px;background:#fff;color:#111}p{margin:0 0 6px}label{display:block}'
    + 'input,select,textarea{display:block;width:240px;margin:2px 0 6px;box-sizing:border-box}input[type=checkbox],input[type=radio]{display:inline-block;width:auto;margin:0 6px 0 0}'
    + 'fieldset label,[role=radiogroup] label{display:inline-block;margin-right:12px}.otp input{display:inline-block;width:32px;margin-right:4px}';
  const results = [];
  const finishedCases = new Set();
  let finished = false;

  /* ---------- helpers ---------- */
  const pad = (n) => String(n).padStart(2, '0');
  const textOf = (n) => ((n && (n.innerText || n.textContent)) || '').replace(/\s+/g, ' ').trim();
  const alnum = (s) => String(s == null ? '' : s).replace(/[^A-Za-z0-9]/g, '').toUpperCase();
  const getPath = (o, p) => p.split('.').reduce((a, k) => (a == null ? a : a[k]), o);
  const isBox = (el) => el.type === 'checkbox' || el.type === 'radio';
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  function deepAll(root, sel, out = []) {
    root.querySelectorAll(sel).forEach((e) => out.push(e));
    root.querySelectorAll('*').forEach((e) => { if (e.shadowRoot) deepAll(e.shadowRoot, sel, out); });
    return out;
  }
  /* a contenteditable editor has no .value: its text is its value */
  const isField = (el) => /^(INPUT|SELECT|TEXTAREA)$/.test(el.tagName);
  const valOf = (el) => (isField(el) ? el.value : textOf(el));
  const snap = (el) => (!isField(el) ? 'txt:' + el.textContent : el.tagName === 'SELECT' ? 'sel:' + (el.multiple ? [...el.selectedOptions].map((o) => o.index).join(',') : el.selectedIndex) + ':' + el.value
    : isBox(el) ? 'chk:' + el.checked : 'val:' + el.value);
  const pristine = (el) => (el.tagName === 'SELECT' ? el.selectedIndex === Math.max(0, [...el.options].findIndex((o) => o.defaultSelected))
    : isBox(el) ? el.checked === el.defaultChecked : el.value === el.defaultValue);
  function shown(el) {
    if (el.tagName === 'SELECT' && el.multiple) return `[${[...el.selectedOptions].map((o) => o.text.trim()).join(', ') || 'nothing selected'}]`;
    if (el.tagName === 'SELECT') { const o = el.options[el.selectedIndex]; return o ? `[${el.selectedIndex}] ${o.text.trim()} (value ${JSON.stringify(o.value)})` : '[nothing selected]'; }
    return isBox(el) ? (el.checked ? 'checked' : 'unchecked') : JSON.stringify(valOf(el));
  }
  const digits = (s) => String(s == null ? '' : s).replace(/\D/g, '');
  const tick = () => new Promise((r) => setTimeout(r, 0));
  /* the same phone number: a phone object (national / subscriber / e164) or a string, compared as digits */
  function telEq(v, x) {
    const d = digits(v), want = (x && typeof x === 'object' ? [x.national, x.subscriber, x.e164] : [x]).map(digits).filter((s) => s.length >= 7);
    return d.length >= 7 && want.some((w) => w === d || w.endsWith(d) || d.endsWith(w));
  }
  const labelOf = (b) => textOf(b.labels && b.labels[0]) || textOf(b.closest('label')) || b.value;
  function nameOf(el) {
    const lab = (el.labels && el.labels[0] && textOf(el.labels[0])) || el.getAttribute('aria-label') || el.getAttribute('placeholder') || el.getAttribute('autocomplete') || el.name || '';

  }

  /* ---------- macros ---------- */
  const optionsOf = (pairs) => pairs.map(([v, t]) => `<option value="${esc(v)}">${esc(t === undefined ? v : t)}</option>`).join('');
  const range = (a, b) => { const r = []; const s = a <= b ? 1 : -1; for (let i = a; s > 0 ? i <= b : i >= b; i += s) r.push(i); return r; };
  const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  const US_STATES = 'AL Alabama|AK Alaska|AZ Arizona|AR Arkansas|CA California|CO Colorado|CT Connecticut|DE Delaware|DC District of Columbia|FL Florida|GA Georgia|HI Hawaii|ID Idaho|IL Illinois|IN Indiana|IA Iowa|KS Kansas|KY Kentucky|LA Louisiana|ME Maine|MD Maryland|MA Massachusetts|MI Michigan|MN Minnesota|MS Mississippi|MO Missouri|MT Montana|NE Nebraska|NV Nevada|NH New Hampshire|NJ New Jersey|NM New Mexico|NY New York|NC North Carolina|ND North Dakota|OH Ohio|OK Oklahoma|OR Oregon|PA Pennsylvania|RI Rhode Island|SC South Carolina|SD South Dakota|TN Tennessee|TX Texas|UT Utah|VT Vermont|VA Virginia|WA Washington|WV West Virginia|WI Wisconsin|WY Wyoming'
    .split('|').map((s) => [s.slice(0, 2), s.slice(3)]);
  const MACROS = {
    days: '<option value="">Day</option>' + optionsOf(range(1, 31).map((n) => [n, n])),
    months: '<option value="">Month</option>' + optionsOf(MONTHS.map((m, i) => [i + 1, m])),
    years: '<option value="">Year</option>' + optionsOf(range(2012, 1950).map((n) => [n, n])),
    mm: '<option value="">MM</option>' + optionsOf(range(1, 12).map((n) => [pad(n), pad(n)])),
    yyyy: '<option value="">YYYY</option>' + optionsOf(range(2026, 2036).map((n) => [n, n])),
    'us-states': '<option value="">Select a state</option>' + optionsOf(US_STATES),
    // Facebook-style: the placeholder is <option value="0">Day</option>
    days0: '<option value="0">Day</option>' + optionsOf(range(1, 31).map((n) => [n, n])),
    months0: '<option value="0">Month</option>' + optionsOf(MONTHS.map((m, i) => [i + 1, m.slice(0, 3)])),
    years0: '<option value="0">Year</option>' + optionsOf(range(2012, 1950).map((n) => [n, n])),
    'n0-30': optionsOf(range(0, 30).map((n) => [n, n])),
    // no placeholder: the first option is only the default
    'days-np': optionsOf(range(1, 31).map((n) => [n, n])), 'months-np': optionsOf(MONTHS.map((m, i) => [i + 1, m])), 'years-np': optionsOf(range(2012, 1950).map((n) => [n, n])),
    // card expiry years from this year on
    'yyyy-now': '<option value="">YYYY</option>' + optionsOf(range(new Date().getFullYear(), new Date().getFullYear() + 10).map((n) => [n, n])),
  };
  /* ---------- dates ---------- */
  const MON = MONTHS.map((m) => m.slice(0, 3).toLowerCase());
  const num = (d) => d.y * 1e4 + d.m * 100 + d.d;
  const realDate = (d) => { const t = new Date(d.y, d.m - 1, d.d); return t.getFullYear() === d.y && t.getMonth() === d.m - 1 && t.getDate() === d.d; };
  const dayOff = (n) => { const t = new Date(); t.setHours(12, 0, 0, 0); t.setDate(t.getDate() + n); return t; };
  const isoDay = (t) => `${t.getFullYear()}-${pad(t.getMonth() + 1)}-${pad(t.getDate())}`;
  const todayN = () => { const t = new Date(); return num({ y: t.getFullYear(), m: t.getMonth() + 1, d: t.getDate() }); };
  function isoWeek(t) {
    const d = new Date(Date.UTC(t.getFullYear(), t.getMonth(), t.getDate())), day = d.getUTCDay() || 7;
    d.setUTCDate(d.getUTCDate() + 4 - day);
    const y = d.getUTCFullYear();
    return `${y}-W${pad(Math.ceil(((d - Date.UTC(y, 0, 1)) / 864e5 + 1) / 7))}`;
  }
  function weekMonday(y, w) {
    const jan4 = new Date(Date.UTC(y, 0, 4)), mon = new Date(jan4);
    mon.setUTCDate(jan4.getUTCDate() - (jan4.getUTCDay() || 7) + 1 + (w - 1) * 7);

  }
  const DYN = {
    date: (n) => isoDay(dayOff(n)), dt: (n) => isoDay(dayOff(n)) + 'T09:00', week: (n) => isoWeek(dayOff(7 * n)),

    month: (n) => { const t = new Date(); t.setDate(1); t.setMonth(t.getMonth() + n); return `${t.getFullYear()}-${pad(t.getMonth() + 1)}`; },
  };
  const expand = (html) => html.replace(/\{\{([\w-]+)(?::([+-]?\d+))?\}\}/g, (m, k, n) => (n !== undefined ? (DYN[k] ? DYN[k](+n) : m) : k in MACROS ? MACROS[k] : m))
    .replace(/<(\/?)fg-script>/g, '<$1script>');
  /* {y, m, d|null, yy} from text in format f (tokens YYYY YY MMMM MMM MM M DD D, anything else literal) */

    const toks = [];
    const re = f.replace(/YYYY|YY|MMMM|MMM|MM|M|DD|D|[\s\S]/g, (t) => (RE[t] ? (toks.push(t), RE[t]) : t.replace(/[.*+?^${}()|[\]\\/]/g, '\\$&')));

      else if (t.length >= 3) o.m = MON.indexOf(x.slice(0, 3).toLowerCase()) + 1;
      else if (t[0] === 'M') o.m = +x;
      else o.d = +x;
    });
    return o.y && o.m >= 1 && o.m <= 12 ? o : null;
  }
  /* the date a field holds: { p: {y, m, d|null, yy}, a: first day, b: last day } (a month / week / MM-YY spans days), or null */

        add(`${ariaName(el)} ${tok}`, r[0], tok.replace(/\$(\w+)/, (m, p) => `${m}=${JSON.stringify(getPath(ctx.E, p))}`), r[1]);
      }
    }
    for (const name of def.checks) {
      if (!CHECKS[name]) { add(name, false, 'a known custom check', 'no such check'); continue; }
      if (fillErr && !def.nofill) { add(name, false, 'fill() to run', fillErr); continue; }
      try { await CHECKS[name](ctx); } catch (e) { add(name, false, 'no exception', e && e.message); }
    }
    return rows;
  }

  async function runCase(def, frames) {
    const agg = new Map();
    for (let i = 0; i < frames.length; i++) {
      let rows;
      try { rows = await runOnce(def, frames[i], makePersona(def.persona, def.patch, def.prefs)); }
      catch (e) { rows = [{ check: 'case setup', pass: false, expected: 'no exception', actual: String(e && e.message) }]; }
      for (const r of rows) {
        if (!agg.has(r.check)) agg.set(r.check, Object.assign({}, r, { pass: true, fails: 0, runs: 0 }));
        const a = agg.get(r.check);
        a.runs++;
        if (!r.pass) { a.fails++; if (a.pass) { a.pass = false; a.expected = r.expected; a.actual = r.actual + (frames.length > 1 ? ` (run ${i + 1})` : ''); } }
        else if (a.pass) a.actual = r.actual;
      }
      if (!KEEP) frames[i].remove();
    }
    return [...agg.values()].map((a) => Object.assign(a, { runs: frames.length }));
  }

  /* ---------- report ---------- */
  function finish(reason) {
    if (finished) return;
    finished = true;
    if (reason !== 'done') {
      for (const def of CASES) if ((!ONLY || def.id.startsWith(ONLY)) && !finishedCases.has(def.id)) results.push({ item: def.item, case: def.id, title: def.title, check: 'case finished within the time budget', pass: false, expected: 'finished', actual: reason });
    }
    const pass = results.filter((r) => r.pass).length, total = results.length;
    document.title = `FG-RESULT ${pass}/${total}`;
    const items = {};
    results.forEach((r) => { const it = (items[r.item] = items[r.item] || [0, 0]); it[1]++; if (r.pass) it[0]++; });
    const sum = document.getElementById('summary');
    sum.className = '';
    sum.textContent = `FG-RESULT ${pass}/${total} · ${total - pass} failing · ` + Object.entries(items).map(([k, [p, t]]) => `${k} ${p}/${t}`).join(' · ') + (reason !== 'done' ? ` · stopped: ${reason}` : '');
    const rows = results.map((r) => `<tr class="${r.pass ? 'pass' : 'fail'}"><td class="r">${r.pass ? 'PASS' : 'FAIL'}</td><td>${esc(r.case)}</td><td>${esc(r.check)}${r.runs > 1 ? ` <span class="muted">×${r.runs}</span>` : ''}</td><td><code>${esc(r.expected)}</code></td><td><code>${esc(r.actual)}</code></td></tr>`).join('');
    document.getElementById('report').innerHTML = `<table><thead><tr><th></th><th>Case</th><th>Check</th><th>Expected</th><th>Actual</th></tr></thead><tbody>${rows}</tbody></table>`;
    document.getElementById('results').textContent = JSON.stringify({ pass, total, reason, ms: Math.round(performance.now()), ua: navigator.userAgent, results }, null, 1);
  }

  async function main() {
    const H = (check, pass, expected, actual) => results.push({ item: 'H', case: 'H.load', title: 'harness: scripts load in the fixture page', check, pass: !!pass, expected, actual: String(actual) });
    const fg = window.__formGhost;
    H('lib/persona.js exposes FormGhost.generate', window.FormGhost && typeof FormGhost.generate === 'function', 'function', window.FormGhost ? typeof FormGhost.generate : 'FormGhost missing');
    H('content/filler.js exposes window.__formGhost', !!fg, 'object', typeof fg);
    H('window.__formGhost.fill is a function', fg && typeof fg.fill === 'function', 'function', fg ? typeof fg.fill : 'missing');
    H('window.__formGhost.inspect is a function', fg && typeof fg.inspect === 'function', 'function', fg ? typeof fg.inspect : 'missing');
    for (const m of ['widgets', 'qa', 'overlay']) H(`content/${m}.js exposes window.__fgExt.${m}`, !!(window.__fgExt && window.__fgExt[m]), 'object', window.__fgExt ? typeof window.__fgExt[m] : '__fgExt missing');
    const stage = document.getElementById('stage');
    const list = CASES.filter((c) => !ONLY || c.id.startsWith(ONLY));
    // frames load a few cases ahead (each loads eight scripts; mounting every case at once starved the first cases' own loads)
    const AHEAD = 24, mounted = [];
    const mountAt = (i) => { if (i < list.length && !mounted[i]) mounted[i] = Promise.all(Array.from({ length: list[i].repeat }, () => mount(list[i], stage))); };
    for (let i = 0; i < AHEAD; i++) mountAt(i);
    for (let i = 0; i < list.length; i++) {
      mountAt(i + AHEAD);
      const def = list[i];
      let rows, timer;
      const hung = new Promise((res) => { timer = setTimeout(() => res([{ check: 'case finished in time', pass: false, expected: `under ${def.timeout * def.repeat / 1e3} s`, actual: 'timed out: a promise never settled' }]), def.timeout * def.repeat); });
      try { rows = await Promise.race([runCase(def, await mounted[i]), hung]); } catch (e) { rows = [{ check: 'case ran', pass: false, expected: 'no exception', actual: String(e && e.stack || e) }]; }
      clearTimeout(timer);
      rows.forEach((r) => results.push(Object.assign({ item: def.item, case: def.id, title: def.title }, r)));
      finishedCases.add(def.id);
    }
    finish('done');
  }

  setTimeout(() => finish('timeout: the harness did not finish in 29.7 s of page time'), 29700);
  main().catch((e) => { results.push({ item: 'H', case: 'H.main', title: 'harness', check: 'harness ran to completion', pass: false, expected: 'no exception', actual: String(e && e.stack || e) }); finish('harness error'); });
})();
</script>
</body>
